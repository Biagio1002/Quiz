<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz App</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div id="app" class="container">
    <h1>Quiz</h1>

    <!-- Scelta materia -->
<div id="subject-box">
  <p>Seleziona la materia:</p>

  <button class="subject-btn" data-file="quiz-automazioneIndustriale.json">
    Automazione Industriale
  </button>

  <div id="mode-box" class="hidden">
    <p>Seleziona modalità:</p>
    <button id="mode-quiz-btn" class="mode-btn">🎯 Quiz</button>
    <button id="mode-edit-btn" class="mode-btn mode-btn--edit">✏️ Modifica risposte mancanti</button>
  </div>
</div>


    <!-- Progress bar e quiz -->
    <div class="progress-container hidden">
      <div id="progress-bar"></div>
    </div>

    <!-- Contatore domande corrette / completate -->
    <div id="progress-text" class="progress-text"></div>
    
    <div id="question-box"></div>
    <div id="answers-box"></div>
    <div id="feedback"></div>

    <button id="next-btn" class="hidden">Prossima</button>
    <button id="stop-btn" class="hidden">Ferma Quiz</button>
    <button id="export-btn" class="hidden">💾 Esporta JSON aggiornato</button>
  </div>

  <script src="app.js" defer></script>
</body>

</html>
